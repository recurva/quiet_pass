name: quietpass
description: "QuietPass, a calm real-time status and coordination app for shared homes."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Typography (Plus Jakarta Sans)
  google_fonts: ^6.3.2

  # Responsive scaling, the core of the "works on every screen size" plan
  flutter_screenutil: ^5.9.3

  # Firebase (phone auth, push notifications)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.5

  # Renders a system notification for a push that arrives while
  # FirebaseMessaging.onMessage fires (Android's own "this app counts as
  # foreground" determination — not the same as the WS-banner-covers-it
  # case, and not something firebase_messaging shows on its own).
  flutter_local_notifications: ^18.0.1

  # Secure on-device storage for the Firebase ID token (sent as the backend Bearer header)
  flutter_secure_storage: ^9.2.2

  # Plain (non-secret) local key-value storage — just the chosen theme mode,
  # so flutter_secure_storage's encryption overhead isn't worth reaching for.
  shared_preferences: ^2.3.3

  # Backend HTTP calls
  http: ^1.2.2

  # Live group status stream
  web_socket_channel: ^3.0.1

  # Native share sheet, for sharing a house's invite code to WhatsApp/etc.
  share_plus: ^10.1.3

  # Renders the in-app Wi-Fi guest QR code
  qr_flutter: ^4.1.0

  # Picking a photo from the gallery/camera for avatar upload
  image_picker: ^1.1.2

  # Renders the QuietPass logo mark (assets/icon/quietpass_logo.svg) in-app
  flutter_svg: ^2.3.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

  # App icon / splash screen generation (dev-only — these tools run once
  # at build-setup time and ship nothing into the app itself)
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# App icon: flutter_launcher_icons generates every platform size from the
# one master image, so there's nothing to keep in sync by hand.
# image_path (icon.png) is the mark pre-composited onto the soft dark
# tile, used for iOS/web/non-adaptive Android; adaptive_icon_foreground is
# the mark alone on a transparent layer, paired with
# adaptive_icon_background as its backing tile on Android 8+.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#161A21"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

# Splash screen: the same soft dark tile (--surface) as the launcher icon's
# background, with the mark alone — see theme/app_palette.dart's
# DarkPalette.surface for where #161A21 comes from.
flutter_native_splash:
  color: "#161A21"
  image: assets/icon/splash_mark.png
  color_dark: "#161A21"
  image_dark: assets/icon/splash_mark.png
  android_12:
    color: "#161A21"
    image: assets/icon/splash_mark.png
    color_dark: "#161A21"
    image_dark: assets/icon/splash_mark.png

# Notes:
# Versions are pinned for reproducible builds. When you first set up, run
#   flutter pub get
# If a transitive constraint complains on your SDK, run
#   flutter pub upgrade --major-versions
# and re-pin the resolved versions here.
