org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Windows-only: the Kotlin incremental compiler crashes computing a
# relative path between the project (D:) and the pub cache (C:) —
# "this and base files have different roots". Disabling incremental
# compilation avoids the cross-drive relative-path computation entirely;
# full Kotlin recompiles are slower but reliable. Real upstream bug, not
# specific to any plugin — first surfaced here via shared_preferences,
# but would hit any plugin with native Kotlin source.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
