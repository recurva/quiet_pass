services:
  postgres:
    image: postgres:16-alpine
    container_name: quietpass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quietpass
      POSTGRES_PASSWORD: quietpass
      POSTGRES_DB: quietpass
    ports:
      - "5433:5432"
    volumes:
      - quietpass_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quietpass -d quietpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quietpass_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quietpass_postgres_data:
